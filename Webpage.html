<!DOCTYPE html>
<html>
    <head>
        <title>CSS Basic WebPage</title>
        <style>
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr; 
                gap: 20px;
            }
            .box {
                background-color:blueviolet;
                padding:30px;
                text-align:center;
                border:3px solid green;
            }
        </style>
    </head>
    <body>
        <h2>CSS Login Page</h2>
        <div class="container">
            <table>
                <tr>
                    <td align="right">
                        <label>Username:</label>
                    </td>
                    <td>
                        <input type="text" name="username">
                    </td>
                    </tr>
                    <tr>
                    <td align="right">
                        <label>Password:</label>
                    </td>
                    <td>
                        <input type="password" name="password">
                    </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Login">
                        </td> 
                    </tr>
            </table>
        </div>
    </body>
</html>
